name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Новый push в ту же ветку отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  lint:
    name: Формат и анализ GDScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gdtoolkit
        run: pip install gdtoolkit==4.5.0
      - name: Формат
        run: gdformat --check --line-length 120 .
      - name: Анализ
        run: gdlint .

  smoke:
    name: Дымовой прогон
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - name: Импорт ресурсов
        run: godot --headless --path . --import
      - name: Прогон за всех героев
        # Ошибки скрипта Godot только печатает и не меняет код выхода — поэтому ищем их в логе.
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . res://tests/smoke.tscn 2>&1 | tee smoke.log
          if grep -nE "SCRIPT ERROR|^ERROR|SMOKE FAIL" smoke.log; then exit 1; fi
          grep -q "SMOKE OK" smoke.log

  android:
    name: Сборка APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Кэш шаблонов Android
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-android-${{ env.GODOT_VERSION }}
      - name: Скачать шаблоны Android
        if: steps.templates.outputs.cache-hit != 'true'
        # Архив шаблонов весит больше гигабайта — из него берём только Android.
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j -q /tmp/templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$dir"
          rm /tmp/templates.tpz

      - name: Настройки редактора
        # Отладочный ключ общий (ci/debug.keystore), поэтому новый APK ставится поверх прежнего.
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/ci/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Импорт ресурсов
        run: godot --headless --path . --import
      - name: Экспорт
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/echo.apk 2>&1 | tee export.log
          test -s build/echo.apk
          ls -lh build/echo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: echo-debug-apk
          path: build/echo.apk
          retention-days: 14
